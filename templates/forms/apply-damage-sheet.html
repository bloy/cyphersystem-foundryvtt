<div class="standard-form">
    <div class="form-group">
      <label for="{{partId}}-damage">{{localize 'CYPHERSYSTEM.ApplyDamage'}}</label>
      <input id="{{partId-damage}}"
             name="damage"
             type="number"
             value="{{damage}}"
             placeholder="{{localize 'CYPHERSYSTEM.Damage'}}" />
    </div>
    <div class="form-group">
      <label for="{{partId}}-severity">{{localize 'CYPHERSYSTEM.WoundSeverity'}}</label>
      <select id="{{partId}}-severity" name="severity">
        {{selectOptions woundSeverityChoices selected=severity}}
      </select>
    </div>
    <div class="form-group">
      <label for="{{partId}}-poolDamage">{{localize 'CYPHERSYSTEM.PoolDamageOptional'}}</label>
      <input id="{{partId}}-poolDamage" name="poolDamage" type="number" value="{{poolDamage}}" placeholder="0" />
      <select id="{{partId}}-poolDamage-pool" name="pool">
        {{selectOptions poolChoices selected=pool}}
      </select>
    </div>
    <div class="form-group">{{localize 'CYPHERSYSTEM.WoundSeverityHint'}}</div>
    <div class="form-group">
        <button type="submit" name="apply">{{localize 'CYPHERSYSTEM.ApplyDamage'}}</button>
    </div>
  </li>
</div>
